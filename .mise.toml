[env]
# Make mise's `cargo:` backend prefer prebuilt binaries via cargo-binstall
# instead of `cargo install` (compile from source). Saves ~3 minutes per
# cold install of cargo-nextest/sqlx-cli on a fresh runner. cargo-binstall
# itself is provisioned as an `aqua:` tool below (prebuilt download), so
# the chain is binary-only.
MISE_CARGO_BINSTALL = "1"

[tools]
rust = "1.96.0"
node = "25.9.0"
pnpm = "11.5.2"
just = "1.52.0"
lefthook = "2.1.9"
helm = "4.2.0"
helm-cr = "1.8.1"
kubeconform = "0.8.0"
kind = "0.32.0"
helm-ct = "3.14.0"
kubectl = "1.36.2"
actionlint = "1.7.12"
cargo-binstall = "1.20.0"
"cargo:sqlx-cli" = "=0.9.0"
"cargo:cargo-nextest" = "=0.9.137"
zizmor = "1.25.2"
yq = "4.53.3"
