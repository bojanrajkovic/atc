# cargo-deny configuration for ATC
# Run: cargo deny check (from backend/)

[graph]
targets = [
    "x86_64-unknown-linux-gnu",    # Linux dev (x86_64)
    "aarch64-unknown-linux-gnu",   # Linux dev (arm64)
    "x86_64-unknown-linux-musl",   # Container / release (x86_64)
    "aarch64-unknown-linux-musl",  # Container / release (arm64)
    "aarch64-apple-darwin",        # macOS dev (Apple Silicon)
    "x86_64-apple-darwin",         # macOS dev (Intel)
]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
