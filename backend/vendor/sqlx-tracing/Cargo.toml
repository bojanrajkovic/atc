[package]
name = "sqlx-tracing"
version = "0.2.1"
edition = "2024"
rust-version = "1.94"
authors = ["Jérémie Drouet <jeremie.drouet@gmail.com>"]
description = "OpenTelemetry-compatible tracing for SQLx database operations in Rust."
license = "MIT"
repository = "https://github.com/jdrouet/sqlx-tracing"
readme = "README.md"

[features]
postgres = ["sqlx/postgres"]

[dependencies]
futures = "0.3"
# `macros` enables SQLx's offline metadata API, including Executor::describe.
sqlx = { version = "=0.9.0", default-features = false, features = ["macros"] }
tracing = "0.1"
