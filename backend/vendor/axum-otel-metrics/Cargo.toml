[package]
name = "axum-otel-metrics"
version = "0.14.1"
edition = "2021"
license = "MIT"
description = "axum OpenTelemetry metrics middleware with OTLP exporter"
homepage = "https://ttys3.dev/"
repository = "https://github.com/ttys3/axum-otel-metrics/"
documentation = "https://docs.rs/axum-otel-metrics"
readme = "README.md"
keywords = ["axum", "opentelemetry", "metrics", "middleware", "otlp"]
categories = ["web-programming::http-server", "development-tools::profiling"]
exclude = [".github/*", "examples/*", "tests/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
axum = { version = "0.8", default-features = false, features = ["matched-path"] }
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry-semantic-conventions = { version = "0.33", features = ["semconv_experimental"] }
tower = { version = "0.5", default-features = false }
pin-project-lite = "0.2"
http-body = "1.0"
