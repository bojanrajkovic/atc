[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
# Single source of truth for the workspace version. release-please bumps this
# one field (via an extra-files TOML updater on $.workspace.package.version);
# every crate inherits it with `version.workspace = true`. See ADR-0011.
version = "0.3.0"
edition = "2024"
rust-version = "1.94.0"

[workspace.dependencies]
async-trait = "=0.1.89"
tracing = "=0.1.44"
ts-rs = { version = "=12.0.1", features = ["serde-compat", "chrono-impl"] }

# Test/dev binaries on Linux bundle DWARF debug info inside the binary by
# default; for the ~25-test `integration` binary this is the difference
# between a multi-GB target/ and one that fits comfortably on a GitHub-hosted
# Ubuntu runner's ~14 GB free disk. `line-tables-only` keeps the .debug_line
# section (file:line per stack frame in backtraces) and `.symtab` (function
# names) but drops .debug_info (variable/type metadata used only by a live
# debugger). `#[track_caller]` panic locations are independent of debug info
# and continue to show in panic messages. Unwinding (.eh_frame) and
# cargo-llvm-cov coverage maps are likewise independent. See #55.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Third-party crates are effectively never stepped into in a debugger, so drop
# their debug info entirely — a strict superset of the line-tables-only savings
# above, scoped to dependencies only. First-party backtraces (file:line) are
# unaffected. This is what keeps the dev/test `target/` from accreting tens of
# GB of dependency DWARF across toolchain and dependency-version churn.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
