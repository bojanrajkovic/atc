[package]
name = "atc-core"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "=0.4.44", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "1.51.1", features = ["rt", "sync", "time"] }
tokio-util = "0.7.18"
tracing = "=0.1.44"
ts-rs = { workspace = true, features = ["serde-compat", "chrono-impl"] }

[features]
test-support = []

[dev-dependencies]
proptest = "=1.11.0"
serde_json = "=1.0.149"
tokio = { version = "1.51.1", features = ["macros", "rt"] }
