[package]
name = "atc-core"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
tracing = "=0.1.44"
ts-rs = { workspace = true, features = ["serde-compat", "chrono-impl"] }

[features]
test-support = []

[dev-dependencies]
proptest = "=1.11.0"
serde_json = "=1.0.150"
