[package]
name = "atc-server"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
atc-core = { path = "../atc-core" }
atc-github = { path = "../atc-github" }
async-trait = "0.1"
axum = { version = "0.8.8", features = ["ws"] }
axum-prometheus = "0.10.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
metrics = "0.24.3"
metrics-process = "2.4.3"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "chrono", "migrate", "macros", "json"] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = { workspace = true, features = ["serde-compat"] }
chrono = "0.4"

[dev-dependencies]
atc-core = { path = "../atc-core", features = ["test-support"] }
chrono = { version = "0.4", features = ["serde"] }
const-hex = "1.18.1"
futures-util = "0.3.32"
hmac = "0.13.0"
reqwest = { version = "0.13.2", features = ["json"] }
serial_test = "3.4.0"
sha2 = "0.11.0"
testcontainers = { version = "0.27.3", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio-tungstenite = "0.24.0"
tower = "0.5.3"

[build-dependencies]
vergen-gix = { version = "9.1.0", features = ["build", "cargo", "si", "rustc"] }
