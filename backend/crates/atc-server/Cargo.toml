[package]
name = "atc-server"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
atc-core = { path = "../atc-core" }
atc-github = { path = "../atc-github" }
atc-persist = { path = "../atc-persist" }
atc-store-mem = { path = "../atc-store-mem" }
atc-store-pg = { path = "../atc-store-pg" }
atc-wire = { path = "../atc-wire" }
async-trait = { workspace = true }
axum = { version = "=0.8.9", features = ["ws"] }
# STOPGAP (issue #522): pinned to ttys3/axum-otel-metrics's main branch, not
# a crates.io release — the opentelemetry-0.32 bump
# (https://github.com/ttys3/axum-otel-metrics/pull/198) merged to main on
# 2026-07-03 but no release has been cut since (crate metadata still shows
# 0.13.0 as newest). Revert to a version pin once a new release ships.
axum-otel-metrics = { git = "https://github.com/ttys3/axum-otel-metrics", rev = "911fda3a4474d5fb0f7f0707338009ff1a3a1439" }
base64 = "=0.22.1"
chrono = "=0.4.45"
figment = { version = "=0.10.19", features = ["env", "toml", "yaml"] }
getrandom = "=0.4.3"
http = "=1.4.2"
humantime-serde = "=1.1.1"
notify-debouncer-full = "=0.7.0"
opentelemetry = { version = "=0.32.0", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "=0.32.1", features = ["metrics", "trace", "spec_unstable_metrics_views", "rt-tokio"] }
opentelemetry-otlp = { version = "=0.32.0", features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "metrics", "trace"] }
opentelemetry-http = "=0.32.0"
opentelemetry-semantic-conventions = "=0.32.1"
# STOPGAP (issue #522): pinned to phil-opp's opentelemetry 0.32 branch, not a
# crates.io release — haixuanTao/opentelemetry-system-metrics has no
# published version compatible with opentelemetry 0.32 yet
# (https://github.com/haixuanTao/opentelemetry-system-metrics/pull/16 is open,
# green, unmerged). Revert to a version pin once that PR merges and releases.
opentelemetry-system-metrics = { git = "https://github.com/phil-opp/opentelemetry-rust-system-metrics", rev = "c5aff027b4df3bc41bea270e8960fb146dac473b" }
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "rustls"] }
rust-embed = "=8.12.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
tokio = { version = "=1.52.3", features = ["full"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
tower-http = { version = "=0.7.0", features = ["cors", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
tracing-opentelemetry = { version = "=0.33.0", features = ["metrics"] }
ts-rs = { workspace = true, features = ["serde-compat"] }
uuid = { version = "=1.23.4", features = ["v4", "fast-rng"] }

[dev-dependencies]
atc-core = { path = "../atc-core", features = ["test-support"] }
atc-store-mem = { path = "../atc-store-mem", features = ["test-support"] }
# Cross-crate dev-dep activates atc-store-pg's `test-support` feature for the
# integration test binary (PgStoreTestHooks, start_with_test_hooks, sync
# tick / accessor methods on PgStore).
atc-store-pg = { path = "../atc-store-pg", features = ["test-support"] }
chrono = { version = "=0.4.45", features = ["serde"] }
const-hex = "=1.19.1"
futures-util = "=0.3.32"
hmac = "=0.13.0"
opentelemetry_sdk = { version = "=0.32.1", features = ["metrics", "trace", "testing", "spec_unstable_metrics_views"] }
serial_test = "=3.5.0"
# sqlx remains a dev-dep for integration tests under tests/integration/ that
# do ephemeral-DB CREATE/DROP and query helpers. Production sources no longer
# name `sqlx::*` directly after the DbInitError abstraction landed (#169).
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "chrono", "migrate", "macros", "json"] }
sqlx-tracing = { version = "=0.2.1", features = ["postgres"] }
tempfile = "=3.27.0"
testcontainers = { version = "=0.27.3", features = ["reusable-containers"] }
testcontainers-modules = { version = "=0.15.0", features = ["postgres"] }
tokio-tungstenite = "=0.29.0"
tower = "=0.5.3"

[build-dependencies]
vergen-gix = { version = "=10.0.1", features = ["build", "cargo", "si", "rustc"] }
