[package]
name = "atc-store-pg"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true

[features]
# Enables inspection helpers and `PgStore::start_with_test_hooks` for
# integration and unit tests. Activated automatically via the self-referential
# dev-dependency below and the cross-crate dev-dep from `atc-server`.
test-support = []

[dependencies]
atc-core = { path = "../atc-core" }
atc-github = { path = "../atc-github" }
atc-persist = { path = "../atc-persist" }
atc-wire = { path = "../atc-wire" }
async-trait = { workspace = true }
base64 = "=0.22.1"
chrono = "=0.4.45"
const-hex = "=1.19.1"
getrandom = "=0.4.3"
opentelemetry = { version = "=0.32.0", features = ["metrics", "trace"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "chrono", "migrate", "macros", "json"] }
sqlx-tracing = { version = "=0.2.1", features = ["postgres"] }
tokio = { version = "=1.53.0", features = ["sync", "time", "rt", "macros"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
tracing = { workspace = true }
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
uuid = { version = "=1.24.0", features = ["v4", "fast-rng"] }

[dev-dependencies]
# Enables `TestClock` / `fixed_test_timestamp` for deterministic timestamps
# in the session-store integration tests.
atc-core = { path = "../atc-core", features = ["test-support"] }
# Self-referential dev-dependency enables the `test-support` feature when
# building unit tests inside this crate, mirroring the `atc-core`/`atc-server`
# convention.
atc-store-pg = { path = ".", features = ["test-support"] }
testcontainers = { version = "=0.27.3", features = ["reusable-containers"] }
testcontainers-modules = { version = "=0.15.0", features = ["postgres"] }
tokio = { version = "=1.53.0", features = ["full"] }
