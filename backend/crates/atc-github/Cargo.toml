[package]
name = "atc-github"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
atc-core = { path = "../atc-core" }
chrono = { version = "=0.4.44", features = ["serde"] }
const-hex = "=1.19.0"
hmac = "=0.13.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
thiserror = "=2.0.18"
tracing = "=0.1.44"
ts-rs = { workspace = true, features = ["serde-compat"] }

[dev-dependencies]
# Enables `atc_core::fixed_test_timestamp` for deterministic timestamps in
# webhook-translation test fixtures.
atc-core = { path = "../atc-core", features = ["test-support"] }
