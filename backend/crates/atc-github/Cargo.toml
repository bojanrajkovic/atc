[package]
name = "atc-github"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[dependencies]
atc-core = { version = "0.1.0", path = "../atc-core" }
chrono = { version = "0.4.44", features = ["serde"] }
const-hex = "1.18.1"
hmac = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tracing = "0.1.44"
