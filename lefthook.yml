# Three-tier git hooks for ATC
# Tier 1: pre-commit — linters (parallel, glob-filtered)
# Tier 2: commit-msg — conventional commit validation
# Tier 3: pre-push — tests + doc-staleness check

pre-commit:
  parallel: true
  commands:
    clippy:
      glob: "*.rs"
      root: "backend/"
      run: cargo clippy --all-targets --all-features -- -D warnings
    rustfmt:
      glob: "*.rs"
      root: "backend/"
      run: cargo fmt --check
    biome:
      glob: "*.{ts,js}"
      root: "frontend/"
      run: pnpm exec biome check .
    eslint-svelte:
      glob: "*.svelte"
      root: "frontend/"
      run: pnpm exec eslint '**/*.svelte'

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    cargo-test:
      root: "backend/"
      run: cargo test --workspace
    vitest:
      root: "frontend/"
      run: "pnpm exec vitest run --passWithNoTests 2>/dev/null || echo 'vitest: no tests configured yet (skipped)'"
    playwright:
      # Not configured yet — keep conditional until playwright is set up
      run: "if pnpm exec playwright --version >/dev/null 2>&1; then pnpm exec playwright test; else echo 'playwright: not configured yet (skipped)'; fi"
    doc-staleness:
      run: scripts/check-docs-lefthook.sh
