# Three-tier git hooks for ATC
# Tier 1: pre-commit — linters (parallel, glob-filtered)
# Tier 2: commit-msg — conventional commit validation
# Tier 3: pre-push — tests + doc-staleness check

pre-commit:
  parallel: true
  commands:
    clippy:
      glob: "*.rs"
      root: "backend/"
      run: mise exec -- cargo clippy --all-targets --all-features -- -D warnings
    rustfmt:
      glob: "*.rs"
      root: "backend/"
      run: mise exec -- cargo fmt --check
    biome:
      glob: "*.{ts,js,css}"
      root: "frontend/"
      run: mise exec -- pnpm exec biome check .
    eslint-svelte:
      glob: "*.svelte"
      root: "frontend/"
      run: mise exec -- pnpm exec eslint '**/*.svelte'
    prettier-svelte:
      glob: "*.svelte"
      root: "frontend/"
      run: mise exec -- pnpm exec prettier --check '**/*.svelte'

commit-msg:
  commands:
    commitlint:
      run: mise exec -- pnpm exec commitlint --edit {1}

pre-push:
  commands:
    cargo-test:
      root: "backend/"
      run: mise exec -- cargo nextest run --workspace
    vitest:
      root: "frontend/"
      run: mise exec -- pnpm exec vitest run
    doc-staleness:
      run: scripts/check-docs.sh
    staleness-grep:
      run: scripts/check-staleness.sh
