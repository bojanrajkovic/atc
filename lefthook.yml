# Three-tier git hooks for ATC
# Tier 1: pre-commit — linters (parallel, glob-filtered)
# Tier 2: commit-msg — conventional commit validation
# Tier 3: pre-push — tests + doc-staleness check

pre-commit:
  parallel: true
  commands:
    clippy:
      glob: "backend/**/*.rs"
      run: "cd backend && mise exec -- cargo clippy --all-targets --all-features -- -D warnings"
    rustfmt:
      glob: "backend/**/*.rs"
      run: "cd backend && mise exec -- cargo fmt --check"
    biome:
      glob: "frontend/**/*.{ts,js}"
      run: "cd frontend && mise exec -- pnpm exec biome check $(echo {staged_files} | sed 's|frontend/||g')"
    eslint-svelte:
      glob: "frontend/**/*.svelte"
      run: "cd frontend && mise exec -- pnpm exec eslint $(echo {staged_files} | sed 's|frontend/||g')"

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    cargo-test:
      # PHASE 2+ UPDATE REQUIRED: Remove condition when Cargo.toml exists
      run: "if [ -f Cargo.toml ]; then cargo test --all; else echo 'cargo test: no Rust project yet (skipped)'; fi"
    vitest:
      # PHASE 2+ UPDATE REQUIRED: Remove condition when vitest is configured
      run: "if pnpm exec vitest --version >/dev/null 2>&1; then pnpm exec vitest run; else echo 'vitest: not configured yet (skipped)'; fi"
    playwright:
      # PHASE 2+ UPDATE REQUIRED: Remove condition when playwright is configured
      run: "if pnpm exec playwright --version >/dev/null 2>&1; then pnpm exec playwright test; else echo 'playwright: not configured yet (skipped)'; fi"
    doc-staleness:
      run: scripts/check-docs-lefthook.sh
