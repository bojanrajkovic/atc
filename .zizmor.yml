rules:
  superfluous-actions:
    ignore:
      # dtolnay/rust-toolchain declaratively installs a specific toolchain
      # version with components (rustfmt, clippy, llvm-tools-preview).
      # Replacing with raw rustup commands adds verbosity for no benefit.
      - ci.yml:backend

  secrets-outside-env:
    ignore:
      # GITHUB_TOKEN is auto-generated by GitHub Actions per-run.
      # It cannot be scoped to an Environment — false positive.
      - ci.yml:pr-checks
