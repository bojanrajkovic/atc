rules:
  template-injection:
    ignore:
      # Gate jobs use only GitHub-controlled context values in shell:
      # needs.changes.outputs.*, github.event_name, needs.*.result
      # These are not user-controllable and cannot be injected.
      - ci.yml:backend-result
      - ci.yml:frontend-result

  secrets-outside-env:
    ignore:
      # GITHUB_TOKEN is auto-generated by GitHub Actions per-run.
      # It cannot be scoped to an Environment — false positive.
      - ci.yml:pr-checks
