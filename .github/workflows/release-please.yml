name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # Mint a GitHub App installation token so the release PR is opened/updated
      # under the bot identity. This is required (not just nice-to-have) because
      # commits and PR events created with the default GITHUB_TOKEN do NOT trigger
      # downstream workflows (loop-prevention rule), which would leave the release
      # PR with no CI status checks.
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  refresh-lockfile:
    name: Refresh Cargo.lock on Release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      # Mint a fresh app token (job-scoped, can't reuse the previous one).
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_BOT_PRIVATE_KEY }}

      # Look up the bot's user id so commits attribute correctly under
      # <id>+<slug>[bot]@users.noreply.github.com (GitHub's canonical form).
      - name: Resolve bot user identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "user-id=${USER_ID}" >> "$GITHUB_OUTPUT"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Check out release PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
          # We need credentials persisted so the subsequent push works,
          # and the token is the bot's so the push triggers downstream CI.
          persist-credentials: true

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: false

      - name: Read Rust version from mise.toml
        id: rust-version
        run: echo "version=$(mise config get tools.rust)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # zizmor: ignore[superfluous-actions]
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}

      - name: Refresh Cargo.lock for workspace members
        working-directory: backend
        run: |
          # `cargo update --workspace` rewrites only the workspace member entries
          # in Cargo.lock to match the versions in their Cargo.toml files. It does
          # not touch transitive dependencies. This is the minimal change needed
          # to make `cargo build --locked` accept the bumped versions.
          cargo update --workspace

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: ${{ steps.bot.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.bot.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.bot.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          if git diff --quiet -- backend/Cargo.lock; then
            echo "Cargo.lock already in sync, nothing to do"
            exit 0
          fi
          git add backend/Cargo.lock
          git commit -m "chore(release): refresh Cargo.lock"
          git push
