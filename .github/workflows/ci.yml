name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'justfile'
              - '.mise.toml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'justfile'
              - '.mise.toml'
            helm:
              - 'deploy/helm/**'
              - 'scripts/helm-kubeconform*.sh'
              - '.github/workflows/ci.yml'
              - '.mise.toml'
              - 'justfile'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: ci
    permissions:
      contents: read
    env:
      # Use mold instead of lld to avoid SIGBUS/OOM crashes when linking large
      # test binaries (ws_tests, notify_listener_tests) on GitHub-hosted runners.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # Fresh CI runners have no prior state to incrementalize against; the
      # incremental cache just inflates target/ with metadata cargo never
      # reuses. Combined with the workspace's `line-tables-only` dev/test
      # profile (backend/Cargo.toml), this keeps the coverage build's peak
      # target/ within a single-runner disk budget. See #55.
      CARGO_INCREMENTAL: "0"
    steps:
      # Reclaim ~10–15 GB of pre-installed software (Android SDK, .NET,
      # Haskell, Docker images) that the github-hosted ubuntu-24.04 image
      # layers on top of the ~14 GB of free disk. Without it, the
      # coverage build fails with "No space left on device" — see
      # docs/architecture/ci-pipeline.md § Backend job target/ footprint.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mold linker (required to avoid SIGBUS/OOM crashes on large test
      # binaries — see CI architecture doc § mold linker Decision).
      # cmake/pkg-config/perl are needed by various sys crates
      # (aws-lc-sys et al.); already present on ubuntu-24.04 default but
      # idempotent re-install is cheap portability insurance.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mold cmake pkg-config perl

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Read Rust version from mise.toml
        id: rust-version
        run: echo "version=$(mise config get tools.rust)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # zizmor: ignore[superfluous-actions]
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Create frontend dist stub
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --check

      - name: Lint (clippy)
        working-directory: backend
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Compile check
        working-directory: backend
        run: cargo check --locked --workspace

      # Run the type-export check BEFORE the coverage build. cargo-llvm-cov
      # uses RUSTC_WRAPPER to inject `-C instrument-coverage` per first-party
      # crate while reusing dep artifacts from the prior non-coverage build,
      # so the coverage step's additional disk cost is just the first-party
      # crates rebuilt under instrumentation plus the `integration` test
      # binary (which `--lib` skipped at verify-types time). Verify-types
      # second would force a full rebuild of every first-party crate without
      # instrumentation — the bigger peak.
      #
      # `--lib` is the load-bearing flag: ts-rs's `#[derive(TS)]` emits an
      # `export_bindings_<TypeName>` test for each derived type, and every
      # such derive lives in `src/` (library targets) — none in
      # `tests/integration/`. Without `--lib`, cargo also compiles the
      # multi-GB `integration` test binary just to discover those tests,
      # ~doubling the verify-types step's target/ footprint for no gain.
      # See #55.
      - name: Verify generated TypeScript types are current
        run: |
          set -euo pipefail
          mkdir -p frontend/src/lib/types/generated
          cd backend
          TS_RS_EXPORT_DIR="$(cd .. && pwd)/frontend/src/lib/types/generated" \
            cargo test --locked --workspace --lib -- export_bindings
          cd ..
          git diff --exit-code frontend/src/lib/types/generated/ || {
            echo "::error::Generated TypeScript types are out of date. Run 'just types' and commit the changes."
            exit 1
          }

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        working-directory: backend
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info

      # Instrumentation for #55 — captures the post-coverage runner disk
      # state so the rolling impact of cargo profile / step-ordering
      # tweaks is visible in CI logs. `if: always()` so we still capture
      # data when the coverage step has failed (the failure mode worth
      # observing is "No space left on device").
      - name: Report disk usage
        if: always()
        run: |
          echo "::group::Runner disk"
          df -h /
          echo "::endgroup::"
          echo "::group::Backend target/"
          du -sh backend/target 2>/dev/null || true
          du -sh backend/target/debug backend/target/release 2>/dev/null || true
          echo "::endgroup::"

      - name: Upload coverage to Codecov
        if: github.repository == 'bojanrajkovic/atc'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/lcov.info
          flags: backend
          fail_ci_if_error: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-backend
          path: backend/lcov.info
          retention-days: 7
          if-no-files-found: ignore

      - name: Release build
        working-directory: backend
        run: cargo build --locked --release -p atc-server

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Read Node and pnpm versions from mise.toml
        id: versions
        run: |
          echo "node=$(mise config get tools.node)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(mise config get tools.pnpm)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.versions.outputs.pnpm }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Biome)
        working-directory: frontend
        run: pnpm exec biome check .

      - name: Check formatting (Prettier — Svelte files)
        working-directory: frontend
        run: pnpm exec prettier --check '**/*.svelte'

      - name: Lint (ESLint — Svelte files)
        working-directory: frontend
        run: pnpm exec eslint '**/*.svelte'

      - name: Type check (svelte-check)
        working-directory: frontend
        run: pnpm check

      # `--with-deps` installs chromium's apt-level runtime libraries via
      # Playwright's blessed install-deps path (sudo NOPASSWD on
      # ubuntu-24.04). Keeps Playwright's dep list canonical — no manual
      # apt list to drift against upstream.
      - name: Install Playwright browsers and system deps
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Vitest with coverage
        working-directory: frontend
        # Vitest's reporters are configured at the workspace level
        # (vitest.config.ts) — `--coverage` enables collection; the config-set
        # `reportsDirectory: 'coverage/vitest'` and `reporter: ['json', 'lcov']`
        # determine the output. The `--coverage.reporter=lcov` override the
        # previous step used would suppress the json reporter we now need
        # (raw v8 coverage available for local Monocart-style merges).
        run: pnpm exec vitest run --coverage

      - name: Run Playwright with coverage
        working-directory: frontend
        # `@bgotink/playwright-coverage` reporter (configured in
        # `playwright.config.ts`) emits istanbul lcov to `coverage/e2e/lcov.info`
        # alongside the default list reporter. Tests must import from
        # `e2e/lib/fixtures.ts` for the V8 capture hook to fire.
        run: pnpm exec playwright test

      - name: Upload coverage to Codecov
        if: github.repository == 'bojanrajkovic/atc'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        # Two lcov files uploaded in one action call. Codecov merges them
        # server-side by `SF:` path — files exercised by both Vitest and
        # Playwright report a union of covered lines. Files exercised only
        # by E2E (e.g., `CommandPalette.svelte`) appear at their E2E ratio
        # rather than the phantom 0% they would have shown when excluded
        # from Vitest's collection alone.
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/vitest/lcov.info,frontend/coverage/e2e/lcov.info
          flags: frontend
          fail_ci_if_error: true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-frontend
          path: |
            frontend/coverage/vitest/lcov.info
            frontend/coverage/e2e/lcov.info
            frontend/test-results/frame-budget-trace.json
          retention-days: 7
          if-no-files-found: ignore

  helm-lint:
    name: Helm Lint & Unit
    if: needs.changes.outputs.helm == 'true' || github.event_name == 'push'
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise install: false + explicit `mise install helm` so this job doesn't
      # drag in Rust/Node/cargo-tools it never uses. With `install: true` the
      # action runs `mise install` which compiles the cargo: tools from
      # source — minutes of overhead for a job that only needs `helm`.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Install helm via mise
        run: mise install helm

      - name: Install helm-unittest plugin
        run: helm plugin install --verify=false https://github.com/helm-unittest/helm-unittest --version 0.8.2

      - name: Lint chart
        run: helm lint deploy/helm/atc

      - name: Run helm unit tests
        run: helm unittest -f 'deploy/helm/atc/tests/unit/*.yaml' deploy/helm/atc

  helm-validate:
    name: Helm Validate
    if: needs.changes.outputs.helm == 'true' || github.event_name == 'push'
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise install: false + explicit subset so this job doesn't drag in
      # Rust/Node/cargo-tools it never uses. See the helm-lint job above
      # for the rationale.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Install helm + kubeconform via mise
        run: mise install helm kubeconform

      - name: Render and validate all k8s × values combinations
        run: scripts/helm-kubeconform.sh

  helm-install:
    name: Helm Install (kind + ct)
    if: needs.changes.outputs.helm == 'true' || github.event_name == 'push'
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise install: false + explicit subset so this job doesn't drag in
      # Rust/Node/cargo-tools (Rust comes from the inline image build via
      # the Dockerfile's own toolchain). See the helm-lint job above for
      # the broader rationale.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false

      - name: Install helm + kind + chart-testing + kubectl via mise
        run: mise install helm kind helm-ct kubectl

      - name: Read Rust + Node versions from mise.toml
        id: tool-versions
        run: |
          echo "rust=$(mise config get tools.rust)" >> "$GITHUB_OUTPUT"
          echo "node=$(mise config get tools.node)" >> "$GITHUB_OUTPUT"

      # Build the chart's image from this commit and load it into the
      # ephemeral kind cluster. `image.pullPolicy=Never` (set via the
      # ci/test-values.yaml fixture) tells the kubelet to use the loaded
      # image instead of trying to pull from the private GHCR repository.
      # `--build-arg` passes the mise-pinned Rust/Node versions so the
      # built image tracks `.mise.toml` rather than the Dockerfile's ARG
      # defaults (which remain as fallbacks for standalone `docker build`).
      - name: Build atc image for kind
        env:
          RUST_VERSION: ${{ steps.tool-versions.outputs.rust }}
          NODE_VERSION: ${{ steps.tool-versions.outputs.node }}
        run: |
          docker build -t atc:ct -f Dockerfile \
            --build-arg "RUST_VERSION=${RUST_VERSION}" \
            --build-arg "NODE_VERSION=${NODE_VERSION}" \
            .

      - name: Create kind cluster
        # `--wait` blocks until the control-plane Node is Ready. 120 s gives
        # cold-runner headroom for the kindest/node image pull (~30-60 s)
        # plus control-plane init (~20-40 s) without wedging on a flake.
        run: kind create cluster --name atc-ct --wait 120s

      - name: Load atc image into kind
        run: kind load docker-image atc:ct --name atc-ct

      # `ct install` reads `deploy/helm/atc/ci/*-values.yaml` automatically
      # — that fixture pins image.repository=atc, image.tag=ct, and
      # image.pullPolicy=Never to match the kind-loaded build above. The
      # job validates admission, controller acceptance, Pod readiness, and
      # the in-cluster `helm test` (test-connection Pod) on top of the
      # template-only kubeconform matrix in the `helm` job.
      - name: ct install
        run: ct install --config deploy/helm/ct.yaml --charts deploy/helm/atc

      - name: Delete kind cluster
        # Self-healing cleanup. The kind cluster lives inside this pod's
        # DinD sidecar; if dockerd inside dind hangs reaping the
        # control-plane container, `kind delete` returns non-zero. Since
        # the runner pod is ephemeral (ARC reaps it when the workflow
        # finishes), any half-cleaned state dies with the pod — so
        # cleanup flakes should not turn an otherwise-green `ct install`
        # into a red job. Surface them as `::warning::` annotations for
        # visibility instead of failing the step.
        if: always()
        run: |
          set +e
          kind delete cluster --name atc-ct
          kind_rc=$?
          if [ $kind_rc -eq 0 ]; then
            exit 0
          fi
          echo "::warning title=kind cleanup::kind delete cluster exited $kind_rc; falling back to defensive docker cleanup"
          # kind names containers <cluster>-control-plane (and -worker-N for HA topologies).
          docker ps -a --filter "name=^atc-ct-" --format '{{.Names}}' | while read -r container; do
            docker kill "$container" >/dev/null 2>&1
            if docker rm -f -v "$container" >/dev/null 2>&1; then
              echo "  cleaned: $container"
            else
              echo "::warning title=kind cleanup::could not remove $container; runner pod teardown will reap it"
            fi
          done
          docker network rm kind >/dev/null 2>&1 || true
          exit 0

  pr-checks:
    name: PR Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zizmor: ignore[secrets-outside-env]

  backend-result:
    name: Backend Result
    needs: [changes, backend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          if [[ "$BACKEND_CHANGED" != "true" && "$EVENT_NAME" != "push" ]]; then
            echo "No backend changes, skipping"
            exit 0
          fi
          if [[ "$BACKEND_RESULT" != "success" ]]; then
            echo "Backend checks failed: $BACKEND_RESULT"
            exit 1
          fi
          echo "All backend checks passed"

  frontend-result:
    name: Frontend Result
    needs: [changes, frontend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          EVENT_NAME: ${{ github.event_name }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [[ "$FRONTEND_CHANGED" != "true" && "$EVENT_NAME" != "push" ]]; then
            echo "No frontend changes, skipping"
            exit 0
          fi
          if [[ "$FRONTEND_RESULT" != "success" ]]; then
            echo "Frontend checks failed: $FRONTEND_RESULT"
            exit 1
          fi
          echo "All frontend checks passed"

  helm-result:
    name: Helm Result
    needs: [changes, helm-lint, helm-validate, helm-install]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          HELM_CHANGED: ${{ needs.changes.outputs.helm }}
          EVENT_NAME: ${{ github.event_name }}
          HELM_LINT_RESULT: ${{ needs.helm-lint.result }}
          HELM_VALIDATE_RESULT: ${{ needs.helm-validate.result }}
          HELM_INSTALL_RESULT: ${{ needs.helm-install.result }}
        run: |
          if [[ "$HELM_CHANGED" != "true" && "$EVENT_NAME" != "push" ]]; then
            echo "No helm changes, skipping"
            exit 0
          fi
          if [[ "$HELM_LINT_RESULT" != "success" ]]; then
            echo "Helm lint/unit checks failed: $HELM_LINT_RESULT"
            exit 1
          fi
          if [[ "$HELM_VALIDATE_RESULT" != "success" ]]; then
            echo "Helm validate checks failed: $HELM_VALIDATE_RESULT"
            exit 1
          fi
          if [[ "$HELM_INSTALL_RESULT" != "success" ]]; then
            echo "Helm install checks failed: $HELM_INSTALL_RESULT"
            exit 1
          fi
          echo "All helm checks passed"
