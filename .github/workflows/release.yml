name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: taiki-e/create-gh-release-action@f67cf7b2dadd83d36b981e674a6b08063997ce68 # v1.10.0
        with:
          changelog: backend/crates/atc-server/CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build the frontend once and share `frontend/dist` with every binary build
  # in the matrix below. The atc-server binary embeds frontend/dist at compile
  # time via rust-embed (see backend/crates/atc-server/src/assets.rs), so the
  # binary build cannot run from a clean checkout — it would either fail to
  # compile or ship an empty SPA. Doing this once and fanning out via artifact
  # is cheaper than building the frontend three times in the matrix.
  build-frontend:
    name: Build Frontend
    needs: create-release
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: false
          cache: false

      - name: Read Node version from mise.toml
        id: versions
        run: echo "node=$(mise config get tools.node)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          # Disable setup-node v6's automatic package-manager caching.
          # In a tag-triggered release workflow, a poisoned cache from an earlier
          # feature-branch run could end up baked into the published binary.
          package-manager-cache: false

      # Corepack reads the pnpm version from frontend/package.json's
      # "packageManager" field and auto-downloads the pinned version on first
      # invocation. No pnpm/action-setup needed.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: [create-release, build-frontend]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            rustflags: "-C target-feature=+crt-static"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            rustflags: "-C target-feature=+crt-static"
          - target: aarch64-apple-darwin
            runner: macos-15
            rustflags: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # rust-embed (in atc-server) reads ../../../frontend/dist at compile time
      # in release mode. Pull the artifact built once by build-frontend so the
      # cargo build below has real assets to embed.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: taiki-e/upload-rust-binary-action@10c1cf6a3da113ad4e60018e386570529aa5f1d3 # v1.30.0
        with:
          bin: atc-server
          target: ${{ matrix.target }}
          manifest-path: backend/Cargo.toml
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Find archive
        id: archive
        run: |
          ARCHIVE=$(ls atc-server-${{ matrix.target }}.* 2>/dev/null | head -1)
          echo "path=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Attest binary
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ steps.archive.outputs.path }}

  build-container:
    name: Build Container (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Read tool versions from mise
        id: versions
        run: |
          RUST_VERSION=$(grep '^rust' .mise.toml | sed 's/.*= *"\([^"]*\)".*/\1/' | cut -d. -f1,2)
          NODE_VERSION=$(grep '^node' .mise.toml | sed 's/.*= *"\([^"]*\)".*/\1/' | cut -d. -f1)
          echo "rust=${RUST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "node=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUST_VERSION=${{ steps.versions.outputs.rust }}
            NODE_VERSION=${{ steps.versions.outputs.node }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  merge-manifest:
    name: Merge Multi-Arch Manifest
    needs: build-container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Create multi-arch manifest
        run: |
          VERSION="${STEPS_META_OUTPUTS_VERSION}"
          IMAGE="ghcr.io/${{ github.repository }}"

          # Build --tag flags from metadata output (one per semver tag).
          # Uses bash array to safely handle multi-line input without word-splitting fragility.
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "${STEPS_META_OUTPUTS_TAGS}"

          # Single invocation merges platform images into all semver tags
          docker buildx imagetools create \
            "${args[@]}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
        env:
          STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}
          STEPS_META_OUTPUTS_TAGS: ${{ steps.meta.outputs.tags }}

      - name: Get manifest digest
        id: digest
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          VERSION="${STEPS_META_OUTPUTS_VERSION}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}

      - name: Attest container image
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  publish-helm-chart:
    name: Publish Helm Chart
    needs: [create-release, build-container, merge-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      chart-version: ${{ steps.chart-version.outputs.chart-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache: false

      - name: Read chart version
        id: chart-version
        run: |
          if command -v yq &>/dev/null; then
            CHART_VERSION=$(helm show chart deploy/helm/atc | yq '.version')
          else
            CHART_VERSION=$(grep '^version:' deploy/helm/atc/Chart.yaml | awk '{print $2}')
          fi
          echo "chart-version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
                -u "${GITHUB_ACTOR}" \
                --password-stdin
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Package Helm chart
        run: helm package deploy/helm/atc --destination ./dist

      - name: Push Helm chart
        run: |
          helm push \
            "./dist/atc-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/bojanrajkovic/charts"
        env:
          CHART_VERSION: ${{ steps.chart-version.outputs.chart-version }}

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ./dist/atc-*.tgz
