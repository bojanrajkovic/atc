name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# Serialize Release pipelines targeting the same tag. Different tags run in
# parallel (separate groups). cancel-in-progress: false because aborting a
# release midway leaves orphaned partial state — e.g. binaries published to
# the GitHub Release but the container image never pushed, or the Helm
# chart published against a tag whose binaries failed to build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # release-please owns the canonical GitHub Release. When the release PR
      # merges it creates the `v*` tag AND the Release together (one Releases-API
      # call), with the aggregated product changelog as the Release body — so for
      # a real release the Release already exists the moment the tag push triggers
      # this workflow, and this step is a no-op.
      #
      # This step is an idempotent SAFETY NET, not the creator: if a Release for
      # the tag already exists it does nothing (it never edits the body, so
      # release-please's notes stay intact). If one is MISSING, the only
      # legitimate case is a manually-pushed prerelease/rc tag (`v*-rc*` etc.),
      # which release-please does not drive — that gets GitHub-generated notes and
      # the prerelease flag. A missing Release on a STABLE tag is an error
      # (release-please was bypassed or failed); fabricating one and letting the
      # workflow continue would ship an inconsistent release — e.g. the Helm jobs
      # run for non-`-` tags and would package a stale `Chart.yaml` version,
      # clobbering the prior stable chart. So the step fails loud instead.
      # Downstream upload jobs declare `needs: create-release` purely as an
      # ordering gate, so this job must run and either succeed or fail loud.
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists (created by release-please); preserving its notes."
            exit 0
          fi
          case "$TAG" in
            *-*)
              echo "Prerelease tag $TAG has no Release — creating one with generated notes."
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --prerelease
              ;;
            *)
              echo "::error::Stable tag $TAG has no GitHub Release. Stable releases are created by release-please atomically with the tag; refusing to fabricate one. Investigate the release-please run." >&2
              exit 1
              ;;
          esac

  # Build the frontend once and share `frontend/dist` with every binary build
  # in the matrix below. The atc-server binary embeds frontend/dist at compile
  # time via rust-embed (see backend/crates/atc-server/src/assets.rs), so the
  # binary build cannot run from a clean checkout — it would either fail to
  # compile or ship an empty SPA. Doing this once and fanning out via artifact
  # is cheaper than building the frontend three times in the matrix.
  build-frontend:
    name: Build Frontend
    needs: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Node 25 binaries link against libatomic1 (libstdc++'s atomic
      # primitives). Not in github-hosted ubuntu-24.04's default image
      # inventory; without it `node --version` fails with a missing
      # libatomic.so.1 right after setup-node lays the binary down.
      - name: Install Node runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libatomic1

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          cache: false

      - name: Read Node and pnpm versions from mise.toml
        id: versions
        run: |
          echo "node=$(mise config get tools.node)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(mise config get tools.pnpm)" >> "$GITHUB_OUTPUT"

      # pnpm/action-setup must run BEFORE setup-node. setup-node honors
      # cache: pnpm only when a pnpm binary is already on PATH. Mirrors the
      # frontend job in ci.yml.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.versions.outputs.pnpm }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          # Disable setup-node v6's automatic package-manager caching.
          # In a tag-triggered release workflow, a poisoned cache from an earlier
          # feature-branch run could end up baked into the published binary.
          package-manager-cache: false

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 1

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: [create-release, build-frontend]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      # fail-fast: false so an independent matrix entry's failure (e.g.
      # macOS-hosted billing rejection on aarch64-apple-darwin) doesn't
      # cancel the Linux cross-compiles. Release artifacts are
      # arch-independent; partial-success uploads are still useful.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            rustflags: "-C target-feature=+crt-static"
          # aarch64 Linux compiles natively on ubuntu-24.04-arm — GitHub's
          # pinned-arm64 hosted runner. `musl-tools` provides `musl-gcc`,
          # which cargo + cc-rs auto-select as the linker/cc for the
          # aarch64-unknown-linux-musl target, sidestepping the
          # `aws-lc-sys` glibc-vs-musl symbol mismatch documented under
          # release-pipeline.md's Native arm64 Decision.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            rustflags: "-C target-feature=+crt-static"
          - target: aarch64-apple-darwin
            runner: macos-26
            rustflags: ""
    steps:
      # fetch-depth: 0 — vergen-gix in atc-server/build.rs runs `git describe
      # --tags` to emit VERGEN_GIT_DESCRIBE, which `main.rs` and the
      # `atc_build_info` gauge embed into the binary. A shallow clone fetches
      # the tag ref but not the ancestry git describe walks to find the
      # nearest tag, so on a shallow clone vergen falls back to an
      # idempotent-output sentinel and the binary loses the tag label.
      # Full history is a few seconds and only fires on tag pushes.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Install the musl C toolchain (`musl-gcc` wrapper + musl libc
      # headers) so cc-rs / aws-lc-sys link against musl libc, not glibc.
      # Both linux-musl matrix entries need it — each compiles natively
      # against its host arch.
      - if: contains(matrix.target, 'linux-musl')
        name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev

      # build-container now copies this job's linux-musl binaries straight into
      # the release container image instead of recompiling via Dockerfile's own
      # `ARG RUST_VERSION` (mise.toml-driven). Reading the toolchain from
      # .mise.toml here — rather than a hardcoded version — is what keeps the
      # shipped container's Rust version tied to the same source of truth the
      # Dockerfile itself uses.
      - if: contains(matrix.target, 'linux-musl')
        name: Read Rust version from mise.toml
        id: rust-version
        run: echo "rust=$(grep '^rust' .mise.toml | sed 's/.*= *"\([^"]*\)".*/\1/')" >> "$GITHUB_OUTPUT"

      - if: contains(matrix.target, 'linux-musl')
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # zizmor: ignore[superfluous-actions]
        with:
          toolchain: ${{ steps.rust-version.outputs.rust }}
          # Explicitly install the matrix target via rustup so the build step
          # below can use `cargo build --target ...` directly. Without this,
          # upload-rust-binary-action's auto-detect chooses `cross` for
          # x86_64-unknown-linux-musl on amd64-gnu host, which pins
          # `cross v0.2.5` (2022). That old crate fails to compile on
          # modern Rust ("cannot produce proc-macro for clap_derive...").
          targets: ${{ matrix.target }}

      # rust-embed (in atc-server) reads ../../../frontend/dist at compile time
      # in release mode. Pull the artifact built once by build-frontend so the
      # cargo build below has real assets to embed.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: atc-server
          target: ${{ matrix.target }}
          manifest-path: backend/Cargo.toml
          locked: true
          # Force cargo to avoid the action's auto-detected `cross` for
          # cross-compile-like targets — both linux-musl entries compile
          # natively for their host arch, so the proper toolchain comes
          # from `dtolnay/rust-toolchain` (with `targets: ${{ matrix.target }}`)
          # plus `musl-tools` from the apt step above. cross v0.2.5
          # (the pinned version in v1.30.2) fails to build on modern Rust.
          build-tool: cargo
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Find archive
        id: archive
        run: |
          ARCHIVE=$(ls atc-server-${{ matrix.target }}.* 2>/dev/null | head -1)
          echo "path=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      # The two linux-musl entries are natively static (+crt-static) and run
      # unmodified in the distroless runtime image build-container uses below —
      # hand the raw binary off as a workflow artifact so that job can copy it
      # straight in instead of recompiling atc-server a second time inside
      # Docker. Not needed for aarch64-apple-darwin (no container build for it).
      - if: contains(matrix.target, 'linux-musl')
        name: Upload binary for container reuse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # atc-server-bin-* (not atc-server-*, the release-archive naming used by
          # the "Find archive" step above) — this is the raw ephemeral binary for
          # build-container's internal handoff, not the compressed Release asset.
          name: atc-server-bin-${{ matrix.target }}
          path: backend/target/${{ matrix.target }}/release/atc-server
          if-no-files-found: error
          retention-days: 1

      # Attest every binary, prereleases included. The repo is public, so the
      # actions/attest-build-provenance restriction on user-owned private repos
      # no longer applies; rc/dev tags now get the same Sigstore provenance as a
      # canonical release, so policy-gated test environments can verify them.
      - name: Attest binary
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.archive.outputs.path }}

  # Container builds run on each platform's native GitHub-hosted runner —
  # amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm — the same runners
  # build-binaries just used for the matching *-unknown-linux-musl target.
  # Rather than recompiling atc-server a second time via the regular
  # multi-stage Dockerfile, this job downloads that already-built static
  # binary and copies it into the distroless runtime with `Dockerfile.release`
  # (see that file). No Rust/Node toolchain, no cargo-chef, no QEMU.
  #
  # `needs: [create-release, build-binaries]` — `create-release` so a failed
  # release creation (API blip, token issue) never pushes container tags
  # pointing at a release that never came together; `build-binaries` because
  # this job now actually consumes its artifact output, on top of the same
  # partial-release protection as before (`fail-fast: false` there lets an
  # independent matrix entry, e.g. `aarch64-apple-darwin`, fail without
  # cancelling siblings — this needs still blocks the container/chart stages
  # from shipping while a linux-musl binary is missing).
  build-container:
    name: Build Container (${{ matrix.platform }})
    needs: [create-release, build-binaries]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      # `target` must name one of build-binaries' linux-musl entries — it's
      # what selects the `atc-server-bin-*` artifact to download below. A
      # mismatch fails loud (download-artifact errors "not found"), not
      # silently, so this is hand-paired rather than derived.
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The build context for Dockerfile.release is just this one file —
      # keeps the layer that gets sent to the buildx daemon to the binary
      # itself, no repo tree.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atc-server-bin-${{ matrix.target }}
          path: release-bin

      - name: Make binary executable
        run: chmod +x release-bin/atc-server

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `flavor: latest=auto` (the action's default) sets `:latest` only
          # for non-prerelease semver tags, so a pre-release tag like
          # v0.99.0-rc1 publishes `0.99.0-rc1` / `0.99` / `0` but does NOT
          # clobber `:latest`. The earlier `type=raw,value=latest` line
          # forced `:latest` unconditionally — wrong for rc/pre-release tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./release-bin
          file: Dockerfile.release
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: ${{ steps.meta.outputs.labels }}

  merge-manifest:
    name: Merge Multi-Arch Manifest
    needs: build-container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `flavor: latest=auto` (the action's default) sets `:latest` only
          # for non-prerelease semver tags, so a pre-release tag like
          # v0.99.0-rc1 publishes `0.99.0-rc1` / `0.99` / `0` but does NOT
          # clobber `:latest`. The earlier `type=raw,value=latest` line
          # forced `:latest` unconditionally — wrong for rc/pre-release tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create multi-arch manifest
        run: |
          VERSION="${STEPS_META_OUTPUTS_VERSION}"
          IMAGE="ghcr.io/${{ github.repository }}"

          # Build --tag flags from metadata output (one per semver tag).
          # Uses bash array to safely handle multi-line input without word-splitting fragility.
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "${STEPS_META_OUTPUTS_TAGS}"

          # Single invocation merges platform images into all semver tags
          docker buildx imagetools create \
            "${args[@]}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
        env:
          STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}
          STEPS_META_OUTPUTS_TAGS: ${{ steps.meta.outputs.tags }}

      - name: Get manifest digest
        id: digest
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          VERSION="${STEPS_META_OUTPUTS_VERSION}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}

      # Attest the manifest digest for every tag, prereleases included — same
      # rationale as the binary attestation above (public repo, so the
      # user-owned-private-repo restriction is gone).
      - name: Attest container image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  # Skipped on pre-release tags (e.g. v*-rc*, v*-beta*). The chart version comes
  # from Chart.yaml — bumped by release-please on release-PR merge, not by the
  # git tag — so a manually-pushed rc tag still carries the last STABLE chart
  # version. Publishing here would repackage that stable version and `helm push`
  # it to the OCI registry with no skip-existing guard, clobbering the attested
  # stable chart. (The gh-pages job below is shielded by chart-releaser's
  # skip_existing, but would still do pointless work under an rc trigger.) Real
  # prerelease charts would first need the chart version to track the tag.
  publish-helm-chart:
    name: Publish Helm Chart
    needs: [create-release, build-container, merge-manifest]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      chart-version: ${{ steps.chart-version.outputs.chart-version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # install: false + explicit `mise install helm` — this job only needs
      # helm; full `mise install` would drag in Rust/Node/cargo-tools.
      # cache: false because publish-helm-chart runs once per release tag and
      # the saved cache wouldn't help downstream.
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          cache: false

      - name: Install helm via mise
        run: mise install helm

      - name: Read chart version
        id: chart-version
        run: |
          if command -v yq &>/dev/null; then
            CHART_VERSION=$(helm show chart deploy/helm/atc | yq '.version')
          else
            CHART_VERSION=$(grep '^version:' deploy/helm/atc/Chart.yaml | awk '{print $2}')
          fi
          echo "chart-version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
                -u "${GITHUB_ACTOR}" \
                --password-stdin
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Package Helm chart
        run: helm package deploy/helm/atc --destination ./dist

      - name: Push Helm chart
        run: |
          helm push \
            "./dist/atc-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/bojanrajkovic/charts"
        env:
          CHART_VERSION: ${{ steps.chart-version.outputs.chart-version }}

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ./dist/atc-*.tgz

  # Mirror the chart to a classic HTTP Helm repo on GitHub Pages so consumers
  # without GHCR auth can `helm repo add` and `helm install` directly. Runs
  # alongside (and after) the OCI publish in publish-helm-chart so both
  # distribution channels stay in lockstep on the same tag. chart-releaser
  # creates a per-chart GitHub Release (`atc-<version>`) with the .tgz
  # attached, then refreshes index.yaml on the gh-pages branch.
  #
  # Manual prerequisite: GitHub Pages must be enabled with source = `gh-pages`
  # branch in repo Settings → Pages. chart-releaser does not provision Pages.
  publish-helm-pages:
    name: Publish Helm Chart to GitHub Pages
    needs: publish-helm-chart
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      # `contents: write` covers the gh-pages push and the per-chart GitHub
      # Release. Pages serves passively from the branch — no `pages: write`.
      contents: write
    steps:
      # fetch-depth: 0 — chart-releaser diffs the chart against prior tags to
      # decide what's new. Shallow clones make it think nothing changed and
      # silently no-op.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # chart-releaser-action commits the index update to gh-pages. Without
      # a configured git identity the push fails. Use the actor identity so
      # the commit is attributed to whoever triggered the release tag.
      - name: Configure git identity
        env:
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

      # mark_as_latest: false — taiki-e/create-gh-release-action already
      # creates the canonical `v<version>` release with binaries marked
      # latest. Letting chart-releaser mark its `atc-<version>` per-chart
      # release as latest would clobber that.
      #
      # version pinned to v1.8.1 to match the helm-cr tool pinned in
      # .mise.toml — keeps local dry-runs and CI on the same `cr` binary.
      - uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          version: v1.8.1
          charts_dir: deploy/helm
          config: deploy/helm/cr.yaml
          pages_branch: gh-pages
          mark_as_latest: false
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
