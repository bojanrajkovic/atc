name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: taiki-e/create-gh-release-action@f67cf7b2dadd83d36b981e674a6b08063997ce68 # v1.10.0
        with:
          changelog: backend/crates/atc-server/CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            rustflags: "-C target-feature=+crt-static"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            rustflags: "-C target-feature=+crt-static"
          - target: aarch64-apple-darwin
            runner: macos-15
            rustflags: ""
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: taiki-e/upload-rust-binary-action@10c1cf6a3da113ad4e60018e386570529aa5f1d3 # v1.30.0
        with:
          bin: atc-server
          target: ${{ matrix.target }}
          manifest-path: backend/Cargo.toml
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Find archive
        id: archive
        run: |
          ARCHIVE=$(ls atc-server-${{ matrix.target }}.* 2>/dev/null | head -1)
          echo "path=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Attest binary
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ steps.archive.outputs.path }}

  build-container:
    name: Build Container (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Read tool versions from mise
        id: versions
        run: |
          RUST_VERSION=$(grep '^rust' .mise.toml | sed 's/.*= *"\([^"]*\)".*/\1/' | cut -d. -f1,2)
          NODE_VERSION=$(grep '^node' .mise.toml | sed 's/.*= *"\([^"]*\)".*/\1/' | cut -d. -f1)
          echo "rust=${RUST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "node=${NODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUST_VERSION=${{ steps.versions.outputs.rust }}
            NODE_VERSION=${{ steps.versions.outputs.node }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  merge-manifest:
    name: Merge Multi-Arch Manifest
    needs: build-container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Create multi-arch manifest
        run: |
          VERSION="${STEPS_META_OUTPUTS_VERSION}"
          IMAGE="ghcr.io/${{ github.repository }}"

          # Build --tag flags from metadata output (one per semver tag).
          # Uses awk in command substitution to avoid subshell variable scoping issue with pipe.
          TAG_FLAGS=$(echo "${STEPS_META_OUTPUTS_TAGS}" | awk 'NF{printf " --tag %s", $0}')

          # Single invocation merges platform images into all semver tags
          docker buildx imagetools create \
            ${TAG_FLAGS} \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
        env:
          STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}
          STEPS_META_OUTPUTS_TAGS: ${{ steps.meta.outputs.tags }}

      - name: Get manifest digest
        id: digest
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          VERSION="${STEPS_META_OUTPUTS_VERSION}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        env:
          STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}

      - name: Attest container image
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
