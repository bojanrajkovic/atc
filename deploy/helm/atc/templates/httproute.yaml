{{- if .Values.gateway.enabled -}}
{{- if empty .Values.gateway.parentRefs -}}
{{- fail "gateway.enabled=true requires at least one entry in gateway.parentRefs (the Gateway your HTTPRoute attaches to)" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "atc.fullname" . }}
  labels:
    {{- include "atc.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  {{- if .Values.gateway.rules }}
    {{- toYaml .Values.gateway.rules | nindent 4 }}
  {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "atc.fullname" . }}
          port: {{ .Values.service.port }}
  {{- end }}
{{- end }}
