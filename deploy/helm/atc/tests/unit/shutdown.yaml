suite: Graceful shutdown — preStop lifecycle hook and terminationGracePeriodSeconds

templates:
  - deployment.yaml

tests:
  - it: renders preStop sleep lifecycle block with default preStopSleepSeconds=5
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 5

  - it: omits the lifecycle block when preStopSleepSeconds=0
    set:
      shutdown.preStopSleepSeconds: 0
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].lifecycle

  - it: flows non-default terminationGracePeriodSeconds through to the pod spec
    set:
      shutdown.terminationGracePeriodSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60

  - it: renders custom preStopSleepSeconds when set to 10
    set:
      shutdown.preStopSleepSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 10
