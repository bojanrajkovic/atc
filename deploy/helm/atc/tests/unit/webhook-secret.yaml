suite: Webhook secret env var — per-credential secret shape

templates:
  - deployment.yaml

tests:
  - it: does not render ATC_GITHUB__WEBHOOK_SECRET when neither config.github.webhookSecret nor existingSecret.githubWebhook.name is set
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_GITHUB__WEBHOOK_SECRET

  - it: renders ATC_GITHUB__WEBHOOK_SECRET as a plain value when config.github.webhookSecret is set
    set:
      config.github.webhookSecret: "s3cr3t"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_GITHUB__WEBHOOK_SECRET
            value: "s3cr3t"

  - it: renders ATC_GITHUB__WEBHOOK_SECRET from secret when existingSecret.githubWebhook.name and secretKey are set
    set:
      existingSecret.githubWebhook.name: atc-webhook-secret
      existingSecret.githubWebhook.secretKey: webhook_secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_GITHUB__WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: atc-webhook-secret
                key: webhook_secret

  - it: existingSecret.githubWebhook.name wins over config.github.webhookSecret when both are set
    set:
      existingSecret.githubWebhook.name: atc-webhook-secret
      existingSecret.githubWebhook.secretKey: webhook_secret
      config.github.webhookSecret: "inline-s3cr3t"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_GITHUB__WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: atc-webhook-secret
                key: webhook_secret
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_GITHUB__WEBHOOK_SECRET
            value: "inline-s3cr3t"

  - it: renders database and webhook from two different secrets simultaneously
    set:
      existingSecret.database.name: atc-cluster-app
      existingSecret.database.urlKey: uri
      existingSecret.githubWebhook.name: atc-webhook-secret
      existingSecret.githubWebhook.secretKey: webhook_secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: atc-cluster-app
                key: uri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_GITHUB__WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: atc-webhook-secret
                key: webhook_secret

  - it: renders database from existingSecret with no webhook secret set (signature validation off)
    set:
      existingSecret.database.name: atc-cluster-app
      existingSecret.database.urlKey: uri
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: atc-cluster-app
                key: uri
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_GITHUB__WEBHOOK_SECRET

  - it: renders database from inline config with webhook from secret
    set:
      config.databaseUrl: "postgres://user:pw@pg:5432/atc"
      existingSecret.githubWebhook.name: atc-webhook-secret
      existingSecret.githubWebhook.secretKey: webhook_secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_DATABASE_URL
            value: "postgres://user:pw@pg:5432/atc"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_GITHUB__WEBHOOK_SECRET
            valueFrom:
              secretKeyRef:
                name: atc-webhook-secret
                key: webhook_secret

  # Codex P2 follow-up: gate the secret branch on a non-empty key, not just on
  # the secret name. An empty key would render `secretKeyRef.key: ""` which the
  # kubelet cannot resolve at pod start. The chart should fall through to the
  # inline value (or skip entirely) instead.
  - it: skips secret-backed webhook injection when secretKey is empty, even if name is set
    set:
      existingSecret.githubWebhook.name: atc-webhook-secret
      existingSecret.githubWebhook.secretKey: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_GITHUB__WEBHOOK_SECRET

  - it: falls through to inline webhookSecret when existingSecret.name is set but secretKey is empty
    set:
      existingSecret.githubWebhook.name: atc-webhook-secret
      existingSecret.githubWebhook.secretKey: ""
      config.github.webhookSecret: "inline-fallback"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_GITHUB__WEBHOOK_SECRET
            value: "inline-fallback"

  # Same fix applied to the database url path — class-not-instance per
  # CONTRIBUTING.md "Fix the class, not the instance" review norm.
  - it: skips secret-backed database injection when urlKey is empty, even if name is set
    set:
      existingSecret.database.name: atc-cluster-app
      existingSecret.database.urlKey: ""
      config.databaseUrl: "postgres://user:pw@pg:5432/atc"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_DATABASE_URL
            value: "postgres://user:pw@pg:5432/atc"
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: ATC_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: atc-cluster-app
                key: ""
