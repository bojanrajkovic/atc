suite: Metrics port and ServiceMonitor removal — chart no longer exposes /metrics

templates:
  - deployment.yaml
  - service.yaml

tests:
  - it: deployment exposes only the http container port
    template: deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8080
            protocol: TCP
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
          any: true

  - it: service exposes only the http port (no metrics port)
    template: service.yaml
    asserts:
      - lengthEqual:
          path: spec.ports
          count: 1
      - contains:
          path: spec.ports
          content:
            name: http
            port: 80
            targetPort: http
            protocol: TCP
      - notContains:
          path: spec.ports
          content:
            name: metrics
          any: true
