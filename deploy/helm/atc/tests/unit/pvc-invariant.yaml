suite: PVC cross-template invariant — name matches Deployment claimName (AC7.3)

templates:
  - pvc.yaml

tests:
  - it: creates PVC named {release}-atc-data when persistence is enabled
    set:
      persistence.enabled: true
      config.databaseUrl: "sqlite:///var/lib/atc/atc.db"
    asserts:
      - isKind:
          of: PersistentVolumeClaim
      - equal:
          path: metadata.name
          value: RELEASE-NAME-atc-data

---
suite: Deployment volume — references PVC by correct name (AC7.3)

templates:
  - deployment.yaml

tests:
  - it: mounts data volume with correct PVC claimName when persistence is enabled
    set:
      persistence.enabled: true
      config.databaseUrl: "sqlite:///var/lib/atc/atc.db"
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].name
          value: data
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: RELEASE-NAME-atc-data
