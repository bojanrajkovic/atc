<!DOCTYPE html>
<html lang="en" data-theme="radar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATC — Action Traffic Control UI Explorer</title>
<style>
  /* ============================================
     OKLCH COLOR SYSTEM
     Neutral ramp driven by --hue. Switching
     themes changes one variable.
     ============================================ */
  :root {
    --hue: 155;

    /* Neutral surfaces */
    --bg:             oklch(12% 0.063 var(--hue));
    --surface:        oklch(16% 0.063 var(--hue));
    --surface-raised: oklch(20% 0.060 var(--hue));
    --border:         oklch(25% 0.055 var(--hue));

    /* Neutral text */
    --text:           oklch(85% 0.028 var(--hue));
    --text-dim:       oklch(72% 0.030 var(--hue));

    /* Status colors (dark mode) */
    --queued:         oklch(72% 0.15 250);
    --running:        oklch(78% 0.16 80);
    --success:        oklch(72% 0.16 155);
    --failed:         oklch(72% 0.17 25);
    --cancelled:      var(--text-dim);

    /* Accent */
    --accent:         oklch(45% 0.20 250);
    --text-on-accent: white;

    /* Typography — Major Third scale (1.25) rooted at 0.75rem */
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;

    --text-xs:   0.625rem;   /* 10px — uppercase labels, micro UI */
    --text-sm:   0.75rem;    /* 12px — card data, controls, meta */
    --text-base: 0.9375rem;  /* 15px — job names, primary content */

    --leading-tight: 1.2;
    --leading-normal: 1.5;
    --leading-relaxed: 1.6;

    --tracking-tight: -0.01em;
    --tracking-normal: 0;
    --tracking-wide: 0.1em;

    /* Motion — Linear-inspired: fast start, long confident tail */
    --ease-out-expo:  cubic-bezier(0.16, 1, 0.3, 1);
    --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    --duration-fast:  150ms;
    --duration-normal: 250ms;
    --duration-slow:  400ms;
  }

  /* Theme overrides — just change --hue */
  [data-theme="warm"]   { --hue: 70; }
  [data-theme="radar"]  { --hue: 155; }
  [data-theme="violet"] { --hue: 280; }
  [data-theme="pink"]   { --hue: 310; }

  /* Light mode — flip surfaces and use darker status variants */
  .light {
    --bg:             oklch(97% 0.022 var(--hue));
    --surface:        oklch(99% 0.013 var(--hue));
    --surface-raised: oklch(92% 0.025 var(--hue));
    --border:         oklch(85% 0.028 var(--hue));

    --text:           oklch(16% 0.063 var(--hue));
    --text-dim:       oklch(40% 0.040 var(--hue));

    --queued:         oklch(45% 0.18 250);
    --running:        oklch(45% 0.15 80);
    --success:        oklch(42% 0.15 155);
    --failed:         oklch(48% 0.18 25);
    --cancelled:      var(--text-dim);
  }

  /* ============================================
     REDUCED MOTION
     ============================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ============================================
     BASE
     ============================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    font-size: var(--text-sm);
    line-height: var(--leading-normal);
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    transition: background var(--duration-slow) var(--ease-out-expo),
                color var(--duration-slow) var(--ease-out-expo);
  }

  /* ============================================
     CONTROLS PANEL
     ============================================ */
  #controls {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    transition: background var(--duration-slow) var(--ease-out-expo),
                border-color var(--duration-slow) var(--ease-out-expo);
  }

  #controls h1 {
    font-size: 1rem;
    font-weight: 700;
    line-height: var(--leading-tight);
    margin-bottom: 4px;
    color: var(--accent);
    font-family: var(--mono);
    letter-spacing: var(--tracking-wide);
  }

  #controls .subtitle {
    font-size: var(--text-sm);
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .control-group {
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .control-group:last-child { border-bottom: none; }

  .control-group h2 {
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    line-height: var(--leading-tight);
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .control-row label {
    font-size: var(--text-sm);
    color: var(--text);
  }

  select, input[type="range"] {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: var(--text-sm);
    font-family: var(--font);
  }

  select { cursor: pointer; }
  input[type="range"] { width: 100px; }

  /* Focus indicators (AAA) */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .toggle {
    position: relative;
    width: 36px;
    height: 20px;
    background: var(--surface-raised);
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid var(--border);
    padding: 0;
    font: inherit;
    color: inherit;
    transition: background var(--duration-normal) var(--ease-out-expo),
                border-color var(--duration-normal) var(--ease-out-expo);
    flex-shrink: 0;
  }

  .toggle.on { background: var(--accent); border-color: var(--accent); }

  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 14px;
    height: 14px;
    background: var(--text-on-accent);
    border-radius: 50%;
    transition: transform var(--duration-normal) var(--ease-out-expo);
  }

  .toggle.on::after { transform: translateX(16px); }

  .btn {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: var(--text-xs);
    cursor: pointer;
    font-family: var(--font);
    transition: background var(--duration-fast) var(--ease-out-quart),
                transform var(--duration-fast) var(--ease-out-expo);
  }

  .btn:hover { background: var(--border); }
  .btn:active { transform: scale(0.97); }

  .btn-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .preset-btn {
    flex: 1;
    min-width: 70px;
    text-align: center;
    font-size: var(--text-xs);
    padding: 5px 8px;
  }

  .preset-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--text-on-accent);
  }

  /* ============================================
     MAIN AREA
     ============================================ */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ============================================
     RUNNER BAR
     ============================================ */
  #runner-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
    transition: background var(--duration-slow) var(--ease-out-expo);
  }

  .runway {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--text-sm);
  }

  .runway-label {
    font-family: var(--mono);
    font-size: var(--text-xs);
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    min-width: 120px;
  }

  .runway-bar-bg {
    width: 80px;
    height: 8px;
    background: var(--surface-raised);
    border-radius: 4px;
    overflow: hidden;
  }

  .runway-bar-fill {
    height: 100%;
    width: 100%;
    border-radius: 4px;
    transform-origin: left;
    transition: transform var(--duration-normal) var(--ease-out-expo),
                background var(--duration-normal) var(--ease-out-expo);
  }

  .runway-count {
    font-size: var(--text-xs);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    min-width: 50px;
  }

  .runway-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ============================================
     PREVIEW
     ============================================ */
  #preview {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  /* ============================================
     KANBAN LAYOUT
     ============================================ */
  .kanban {
    display: flex;
    gap: 12px;
    height: 100%;
  }

  .kanban-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .kanban-header {
    font-size: var(--text-xs);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    line-height: var(--leading-tight);
    color: var(--text-dim);
    padding: 8px 12px;
    border-bottom: 2px solid var(--border);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .kanban-header .count {
    background: var(--surface-raised);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: var(--text-xs);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .kanban-items {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ============================================
     JOB CARD
     ============================================ */
  .job-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    position: relative;
    overflow: hidden;
    transition: box-shadow var(--duration-normal) var(--ease-out-quart),
                border-color var(--duration-normal) var(--ease-out-quart);
  }

  .job-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
  }

  .job-card.status-queued::before { background: var(--queued); }
  .job-card.status-running::before { background: var(--running); }
  .job-card.status-success::before { background: var(--success); }
  .job-card.status-failed::before { background: var(--failed); }
  .job-card.status-cancelled::before { background: var(--cancelled); }

  /* Pulsating halo for running */
  .job-card.status-running {
    animation: pulse-border 2s ease-in-out infinite;
  }

  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 0 0 0 oklch(78% 0.16 80 / 0); }
    50% { box-shadow: 0 0 8px 2px oklch(78% 0.16 80 / 0.25); }
  }

  .job-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .job-status-icon {
    font-size: var(--text-base);
    flex-shrink: 0;
    width: 1.25em;
    text-align: center;
  }

  .job-status-icon.queued { color: var(--queued); }
  .job-status-icon.running { color: var(--running); }
  .job-status-icon.success { color: var(--success); }
  .job-status-icon.failed { color: var(--failed); }
  .job-status-icon.cancelled { color: var(--cancelled); }

  .job-name {
    font-size: var(--text-base);
    font-weight: 600;
    line-height: var(--leading-tight);
    letter-spacing: var(--tracking-tight);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .job-duration {
    font-size: var(--text-sm);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  .job-meta {
    font-size: var(--text-xs);
    color: var(--text-dim);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .job-progress {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .job-progress-label {
    font-size: var(--text-xs);
    color: var(--text-dim);
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .job-progress-bar {
    flex: 1;
    height: 4px;
    background: var(--surface-raised);
    border-radius: 2px;
    overflow: hidden;
  }

  .job-progress-fill {
    height: 100%;
    border-radius: 2px;
    transform-origin: left;
    transition: transform var(--duration-normal) var(--ease-out-expo);
  }

  .status-queued .job-progress-fill { background: var(--queued); }
  .status-running .job-progress-fill { background: var(--running); }
  .status-success .job-progress-fill { background: var(--success); }
  .status-failed .job-progress-fill { background: var(--failed); }

  .job-runner {
    font-size: var(--text-xs);
    color: var(--text-dim);
    font-family: var(--mono);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .job-runner .runner-icon { margin-right: 4px; }

  /* ============================================
     COMPACT CARD
     ============================================ */
  .job-card.compact {
    padding: 6px 10px;
  }

  .job-card.compact .job-meta,
  .job-card.compact .job-progress,
  .job-card.compact .job-runner { display: none; }

  .job-card.compact .job-name { font-size: var(--text-sm); }

  /* ============================================
     PROMPT OUTPUT
     ============================================ */
  #prompt-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    max-height: 120px;
    overflow-y: auto;
  }

  #prompt-area .prompt-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  #prompt-area .prompt-header span {
    font-size: var(--text-xs);
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--text-dim);
  }

  #prompt-text {
    font-size: var(--text-sm);
    line-height: var(--leading-relaxed);
    color: var(--text);
  }

  .copy-btn {
    background: var(--accent);
    border: none;
    color: var(--text-on-accent);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: var(--text-xs);
    cursor: pointer;
    font-family: var(--font);
    transition: opacity var(--duration-fast) var(--ease-out-quart),
                transform var(--duration-fast) var(--ease-out-expo);
  }

  .copy-btn:hover { opacity: 0.85; }
  .copy-btn:active { transform: scale(0.95); }
  .copy-btn.copied { background: var(--success); }

  /* ============================================
     SCREEN READER ONLY
     ============================================ */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ============================================
     SCROLLBAR
     ============================================ */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<aside id="controls" aria-label="Dashboard controls">
  <h1>⟐ ATC</h1>
  <div class="subtitle">Action Traffic Control — UI Explorer</div>

  <div class="control-group">
    <h2>Presets</h2>
    <div class="btn-row">
      <button class="btn preset-btn active" onclick="applyPreset('radar', this)">Radar</button>
      <button class="btn preset-btn" onclick="applyPreset('minimal', this)">Minimal</button>
    </div>
  </div>

  <div class="control-group">
    <h2>Theme</h2>
    <div class="control-row">
      <label for="theme-select">Color</label>
      <select id="theme-select" onchange="setTheme(this.value)">
        <option value="warm">Warm (70)</option>
        <option value="radar" selected>Radar (155)</option>
        <option value="violet">Violet (280)</option>
        <option value="pink">Pink (310)</option>
      </select>
    </div>
    <div class="control-row">
      <label for="density">Card density</label>
      <select id="density" onchange="s('compact',this.value==='compact');updateAll()">
        <option value="expanded">Expanded</option>
        <option value="compact">Compact</option>
      </select>
    </div>
  </div>

  <div class="control-group">
    <h2>Appearance</h2>
    <div class="control-row">
      <label id="lbl-dark">Dark mode</label>
      <button class="toggle on" id="theme-toggle" onclick="toggleDarkMode()" role="switch" aria-checked="true" aria-labelledby="lbl-dark"></button>
    </div>
    <div class="control-row">
      <label id="lbl-halo">Halo animation</label>
      <button class="toggle on" id="halo-toggle" onclick="toggleHalo()" role="switch" aria-checked="true" aria-labelledby="lbl-halo"></button>
    </div>
    <div class="control-row">
      <label id="lbl-runners">Show runners</label>
      <button class="toggle on" id="runner-toggle" onclick="toggleRunners()" role="switch" aria-checked="true" aria-labelledby="lbl-runners"></button>
    </div>
  </div>

  <div class="control-group">
    <h2>Card style</h2>
    <div class="control-row">
      <label for="radius">Border radius</label>
      <input type="range" id="radius" min="0" max="16" value="6" oninput="s('radius',+this.value);updateAll()">
    </div>
    <div class="control-row">
      <label id="lbl-accent">Left accent bar</label>
      <button class="toggle on" id="accent-toggle" onclick="toggleAccent()" role="switch" aria-checked="true" aria-labelledby="lbl-accent"></button>
    </div>
  </div>

  <div class="control-group">
    <h2>Runners</h2>
    <div class="control-row">
      <label for="linux-runners">Linux runners</label>
      <input type="range" id="linux-runners" min="1" max="10" value="5" oninput="s('linuxRunners',+this.value);updateAll()">
    </div>
    <div class="control-row">
      <label for="macos-runners">macOS runners</label>
      <input type="range" id="macos-runners" min="1" max="5" value="2" oninput="s('macosRunners',+this.value);updateAll()">
    </div>
  </div>

  <div class="control-group">
    <h2>Simulation</h2>
    <div class="btn-row">
      <button class="btn" onclick="addJob('queued')">+ Queued</button>
      <button class="btn" onclick="addJob('running')">+ Running</button>
      <button class="btn" onclick="addJob('failed')">+ Failed</button>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="advanceJobs()">Advance all</button>
      <button class="btn" onclick="resetJobs()">Reset</button>
    </div>
  </div>
</aside>

<main id="main">
  <div id="runner-bar" role="region" aria-label="Runner status"></div>
  <div id="preview" role="region" aria-label="Workflow jobs"></div>
  <div id="prompt-area" role="region" aria-label="Design prompt">
    <div class="prompt-header">
      <span>Design prompt</span>
      <button class="copy-btn" onclick="copyPrompt()">Copy</button>
    </div>
    <div id="prompt-text"></div>
  </div>
</main>

<script>
const SYMBOLS = { queued: '◐', running: '▶', success: '✓', failed: '✗', cancelled: '⊘' };

const REPOS = ['loupe-app/loupe', 'loupe-app/issue-backend', 'coderinserepeat-com/coderinserepeat.com', 'loupe-app/design-system', 'coderinserepeat-com/home.coderinserepeat.com'];
const WORKFLOWS = ['CI', 'Deploy', 'Release', 'Lint & Test', 'Build & Publish'];
const BRANCHES = ['main', 'feat/oauth-flow', 'fix/websocket-reconnect', 'chore/deps', 'feat/atc-dashboard'];
const STEPS = ['Set up job', 'Run actions/checkout@v4', 'Install dependencies', 'Run pnpm install', 'Run lint', 'Run type-check', 'Run unit tests', 'Run integration tests', 'Run playwright tests', 'Build', 'Upload artifacts', 'Deploy to staging', 'Post cleanup'];
const RUNNERS_LINUX = ['loupe-homelab-brajkovic-linux-vbb7l-runner-r86pc', 'loupe-homelab-brajkovic-linux-vbb7l-runner-wcgm5', 'loupe-homelab-brajkovic-linux-abc12-runner-k9x3f'];
const RUNNERS_MACOS = ['loupe-homelab-brajkovic-macos-1', 'loupe-homelab-brajkovic-macos-2'];

const DEFAULTS = {
  theme: 'radar', compact: false, dark: true, halo: true,
  showRunners: true, radius: 6, accentBar: true,
  linuxRunners: 5, macosRunners: 2
};

let state = { ...DEFAULTS };
let jobs = [];
let jobId = 0;

function s(key, val) { state[key] = val; }

// Theme management
function setTheme(name) {
  state.theme = name;
  document.documentElement.dataset.theme = name;
  updateAll();
}

function toggleDarkMode() {
  state.dark = !state.dark;
  document.body.className = state.dark ? '' : 'light';
  updateAll();
}

function toggleHalo() { state.halo = !state.halo; updateAll(); }
function toggleRunners() { state.showRunners = !state.showRunners; updateAll(); }
function toggleAccent() { state.accentBar = !state.accentBar; updateAll(); }

// Toggles are now <button> elements — Enter/Space handled natively

function generateJobs() {
  jobs = [];
  for (let i = 0; i < 2; i++) jobs.push(makeJob('queued'));
  for (let i = 0; i < 4; i++) jobs.push(makeJob('running'));
  for (let i = 0; i < 3; i++) jobs.push(makeJob('success'));
  jobs.push(makeJob('failed'));
  jobs.push(makeJob('cancelled'));
}

function makeJob(status) {
  const repo = REPOS[Math.floor(Math.random() * REPOS.length)];
  const workflow = WORKFLOWS[Math.floor(Math.random() * WORKFLOWS.length)];
  const branch = BRANCHES[Math.floor(Math.random() * BRANCHES.length)];
  const totalSteps = 8 + Math.floor(Math.random() * 5);
  let currentStep;
  if (status === 'queued') currentStep = 0;
  else if (status === 'running') currentStep = 1 + Math.floor(Math.random() * (totalSteps - 2));
  else currentStep = totalSteps;

  const isLinux = Math.random() > 0.3;
  const runnerPool = isLinux ? RUNNERS_LINUX : RUNNERS_MACOS;
  const runner = status === 'queued' ? null : runnerPool[Math.floor(Math.random() * runnerPool.length)];

  const duration = status === 'queued' ? Math.floor(Math.random() * 30) :
                   status === 'running' ? 30 + Math.floor(Math.random() * 180) :
                   60 + Math.floor(Math.random() * 300);

  return {
    id: ++jobId, status, repo, workflow, branch,
    totalSteps, currentStep, runner, duration,
    stepName: STEPS[Math.min(currentStep, STEPS.length - 1)],
    labels: isLinux ? ['self-hosted', 'linux'] : ['self-hosted', 'macos', 'arm64']
  };
}

function addJob(status) {
  jobs.unshift(makeJob(status));
  updateAll();
}

function advanceJobs() {
  jobs.forEach(j => {
    if (j.status === 'queued') {
      j.status = 'running';
      j.currentStep = 1;
      j.runner = (j.labels.includes('macos') ? RUNNERS_MACOS : RUNNERS_LINUX)[0];
    } else if (j.status === 'running') {
      j.currentStep++;
      j.duration += 15;
      if (j.currentStep >= j.totalSteps) {
        j.status = Math.random() > 0.15 ? 'success' : 'failed';
        j.currentStep = j.totalSteps;
      }
      j.stepName = STEPS[Math.min(j.currentStep, STEPS.length - 1)];
    }
  });
  updateAll();
}

function resetJobs() { generateJobs(); updateAll(); }

function fmtDuration(s) {
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), sec = s % 60;
  return sec > 0 ? `${m}m ${sec}s` : `${m}m`;
}

function renderCard(job) {
  const cls = [
    'job-card',
    `status-${job.status}`,
    state.compact ? 'compact' : '',
    !state.halo && job.status === 'running' ? 'no-halo' : '',
    !state.accentBar ? 'no-accent' : ''
  ].filter(Boolean).join(' ');

  const style = `border-radius:${state.radius}px;` +
    (!state.accentBar ? '--accent-w:0;' : '') +
    (!state.halo && job.status === 'running' ? 'animation:none;' : '');

  const pct = job.totalSteps > 0 ? Math.round((job.currentStep / job.totalSteps) * 100) : 0;
  const statusLabels = { queued: 'Queued', running: 'Running', success: 'Succeeded', failed: 'Failed', cancelled: 'Cancelled' };

  return `<article class="${cls}" style="${style}" aria-label="${job.workflow} — ${statusLabels[job.status]}">
    <div class="job-header">
      <span class="job-status-icon ${job.status}" aria-hidden="true">${SYMBOLS[job.status]}</span>
      <span class="job-name">${job.workflow}</span>
      <span class="job-duration" aria-label="Duration: ${fmtDuration(job.duration)}">${fmtDuration(job.duration)}</span>
    </div>
    <div class="job-meta">${job.repo} · ${job.branch}</div>
    <div class="job-progress" role="group" aria-label="Step progress">
      <span class="job-progress-label">Step ${job.currentStep} of ${job.totalSteps}</span>
      <div class="job-progress-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="job-progress-fill" style="transform:scaleX(${pct / 100})"></div></div>
      <span class="job-progress-label">${job.stepName}</span>
    </div>
    ${job.runner ? `<div class="job-runner"><span class="runner-icon" aria-hidden="true">⊞</span><span class="sr-only">Runner: </span>${job.runner}</div>` : ''}
  </article>`;
}

function renderRunnerBar() {
  const bar = document.getElementById('runner-bar');
  if (!state.showRunners) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';

  const linuxUsed = jobs.filter(j => j.status === 'running' && j.labels.includes('linux')).length;
  const macosUsed = jobs.filter(j => j.status === 'running' && j.labels.includes('macos')).length;
  const linuxQueued = jobs.filter(j => j.status === 'queued' && j.labels.includes('linux')).length;
  const macosQueued = jobs.filter(j => j.status === 'queued' && j.labels.includes('macos')).length;

  const runners = [
    { label: 'self-hosted/linux', used: linuxUsed, total: state.linuxRunners, queued: linuxQueued },
    { label: 'self-hosted/macos', used: macosUsed, total: state.macosRunners, queued: macosQueued },
    { label: 'github-hosted', used: 0, total: '∞', queued: 0, elastic: true }
  ];

  bar.innerHTML = runners.map(r => {
    const pct = r.elastic ? 0 : Math.min((r.used / r.total) * 100, 100);
    // Use CSS variables for colors
    const colorVar = r.elastic ? 'var(--cancelled)' :
                     pct >= 100 ? 'var(--failed)' :
                     pct >= 70 ? 'var(--running)' : 'var(--success)';
    const queueNote = r.queued > 0 ? ` (${r.queued} queued)` : '';
    return `<div class="runway">
      <div class="runway-dot" style="background:${colorVar}"></div>
      <span class="runway-label">${r.label}</span>
      <div class="runway-bar-bg"><div class="runway-bar-fill" style="transform:scaleX(${pct / 100});background:${colorVar}"></div></div>
      <span class="runway-count" style="color:${colorVar}">${r.used}/${r.total}${queueNote}</span>
    </div>`;
  }).join('');
}

function renderPreview() {
  const preview = document.getElementById('preview');
  const queued = jobs.filter(j => j.status === 'queued');
  const running = jobs.filter(j => j.status === 'running');
  const completed = jobs.filter(j => ['success', 'failed', 'cancelled'].includes(j.status));

  preview.innerHTML = `<div class="kanban" role="group" aria-label="Job board">
    <section class="kanban-col" aria-label="Queued jobs">
      <h2 class="kanban-header">Queued <span class="count">${queued.length}</span></h2>
      <div class="kanban-items">${queued.map(renderCard).join('')}</div>
    </section>
    <section class="kanban-col" aria-label="Running jobs">
      <h2 class="kanban-header">Running <span class="count">${running.length}</span></h2>
      <div class="kanban-items">${running.map(renderCard).join('')}</div>
    </section>
    <section class="kanban-col" aria-label="Completed jobs">
      <h2 class="kanban-header">Completed <span class="count">${completed.length}</span></h2>
      <div class="kanban-items">${completed.map(renderCard).join('')}</div>
    </section>
  </div>`;
}

function updatePrompt() {
  const parts = [];
  const themeNames = { warm: 'warm gray', radar: 'radar green', violet: 'slate violet', pink: 'magenta pink' };

  parts.push(`Build an ATC (Action Traffic Control) dashboard using a **kanban** layout (Queued | Running | Completed columns)`);
  parts.push(`with a **${themeNames[state.theme]}** OKLCH neutral tone (hue ${document.documentElement.dataset.theme === 'warm' ? 70 : document.documentElement.dataset.theme === 'radar' ? 155 : document.documentElement.dataset.theme === 'violet' ? 280 : 310})`);

  if (state.compact) parts.push('with **compact** card density (icon + name + duration only)');
  else parts.push('with **expanded** cards showing step progress, runner name, and repo/branch context');

  if (!state.dark) parts.push('using a **light** theme');
  else parts.push('using a **dark** theme');

  if (state.radius !== 6) parts.push(`with ${state.radius}px border radius on cards`);
  if (!state.accentBar) parts.push('without left status accent bars');
  if (state.halo) parts.push('with **pulsating halo animation** on running jobs (Concourse-inspired)');
  if (state.showRunners) parts.push(`showing runner capacity bar (${state.linuxRunners} Linux, ${state.macosRunners} macOS runners)`);

  parts.push(`Status indicators use color + symbol duality: queued (blue ◐), running (amber ▶), success (green ✓), failed (red ✗), cancelled (gray ⊘)`);

  document.getElementById('prompt-text').textContent = parts.join('. ') + '.';
}

function updateAll() {
  renderRunnerBar();
  renderPreview();
  updatePrompt();
  syncControls();
}

function syncControls() {
  document.getElementById('theme-select').value = state.theme;
  document.getElementById('density').value = state.compact ? 'compact' : 'expanded';
  document.getElementById('radius').value = state.radius;
  document.getElementById('linux-runners').value = state.linuxRunners;
  document.getElementById('macos-runners').value = state.macosRunners;

  const toggles = [
    ['theme-toggle', state.dark],
    ['halo-toggle', state.halo],
    ['runner-toggle', state.showRunners],
    ['accent-toggle', state.accentBar],
  ];
  toggles.forEach(([id, on]) => {
    const el = document.getElementById(id);
    el.className = 'toggle' + (on ? ' on' : '');
    el.setAttribute('aria-checked', on);
  });

  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}

function applyPreset(name, btn) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const presets = {
    radar: { theme: 'radar', compact: false, dark: true, halo: true, showRunners: true, radius: 6, accentBar: true },
    minimal: { theme: 'warm', compact: true, dark: false, halo: false, showRunners: false, radius: 4, accentBar: false }
  };

  Object.assign(state, presets[name]);
  document.documentElement.dataset.theme = state.theme;
  document.body.className = state.dark ? '' : 'light';
  updateAll();
}

function copyPrompt() {
  const text = document.getElementById('prompt-text').textContent;
  navigator.clipboard.writeText(text);
  const btn = document.querySelector('.copy-btn');
  btn.textContent = 'Copied!';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
}

// Init
generateJobs();
updateAll();

// Tick running job durations
setInterval(() => {
  jobs.forEach(j => { if (j.status === 'running') j.duration++; });
  updateAll();
}, 1000);
</script>
